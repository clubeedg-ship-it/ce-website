summary:
  en: "A restaurant for fine dining with an approachable atmosphere, shaped by warm wood tones, soft light and a sculpted wall."
  nl: "Een restaurant voor fine dining met een toegankelijke sfeer, vormgegeven met warme houttinten, zacht licht en een gebeeldhouwde wand."
brief:
  en: "Design a restaurant that can host fine-dining experiences while keeping an approachable atmosphere."
  nl: "Een restaurant ontwerpen dat fine dining kan huisvesten en toch een toegankelijke sfeer behoudt."
challenge:
  en: "The culinary concept demanded a space that elevates without intimidating."
  nl: "Het culinaire concept vroeg om een ruimte die verheft zonder te intimideren."
outcome:
  en: "Warm wood tones and soft lighting create an intimate setting where guests feel special but relaxed. The design supports the culinary experience without competing with it."
  nl: "Warme houttinten en zacht licht scheppen een intieme setting waarin gasten zich bijzonder maar ontspannen voelen. Het ontwerp ondersteunt de culinaire beleving zonder ermee te concurreren."
