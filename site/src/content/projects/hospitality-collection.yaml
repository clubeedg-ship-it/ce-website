summary:
  en: A bar and lounge in Amsterdam, built turn-key around dramatic lighting, bespoke bar furniture and a gold mesh back wall.
  nl: Een bar en lounge in Amsterdam, turn-key gebouwd rond dramatische verlichting, maatwerk barmeubilair en een gouden gaaswand.
brief:
  en: Create a distinctive bar and lounge that stands out in Amsterdam’s competitive hospitality scene.
  nl: Een onderscheidende bar en lounge creëren die opvalt in de concurrerende Amsterdamse horecascene.
challenge:
  en: The space needed to feel both exclusive and welcoming.
  nl: De ruimte moest tegelijk exclusief en uitnodigend aanvoelen.
outcome:
  en: A signature atmosphere achieved through dramatic lighting, bespoke bar furniture and carefully curated materials. The venue became a destination, not just a place to drink.
  nl: Een kenmerkende sfeer, bereikt met dramatische verlichting, maatwerk barmeubilair en zorgvuldig gekozen materialen. De zaak werd een bestemming, niet alleen een plek om te drinken.
